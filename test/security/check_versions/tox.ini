[tox]
envlist = black, pylint, pytest
skipsdist = true

[testenv]
basepython = python3.8
deps = -r{toxinidir}/requirements.txt

[testenv:black]
commands = black {toxinidir}/versions tests
deps = black

[testenv:pylint]
    commands = pylint -d W0511,W0107,R0913,R0917,W1514,W0613,C0116,C0206,C0209,E1121,R0801,C0301,C0114,W0221 {toxinidir}/versions
deps= pylint

[testenv:pytest]
setenv = PYTHONPATH = {toxinidir}/src
commands = pytest -vv -s tests
